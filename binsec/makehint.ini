# Analyze MakeHint with the ML-DSA-44 dimensions (K=4, Omega=80).
# Go ABIInternal arguments at entry:
#   AX = cfg
#   BX, CX, DI = z data, len, cap
#   SI, R8, R9 = r data, len, cap
starting from <ml-dsa/internal/util.MakeHint>
with concrete stack pointer

rax := 0x400000 as cfg
rbx := 0x410000 as z_data
rcx := 4 as z_len
rdi := 4 as z_cap
rsi := 0x420000 as r_data
r8 := 4 as r_len
r9 := 4 as r_cap

# Cfg.K is at offset 0x1c; Cfg.Omega is at offset 0x20.
@[0x40001c, 8] := 4
@[0x400020, 8] := 80

# Each Rq is 256 uint32 coefficients: 4 * 256 * 4 bytes per input.
@[0x410000, 131072] := secret as z
@[0x420000, 131072] := secret as r

# Go's stack-growth check reads g.stackguard0 from r14+16.
r14 := 0x300000
@[r14 + 16, 8] := 0

# Model the result backing array returned by make([]ring.R2, K).
replace <runtime.makeslice> by
  rax := 0x430000
  return
end

halt at <ml-dsa/internal/util.MakeHint> return
explore all
