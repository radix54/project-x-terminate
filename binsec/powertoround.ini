# Worked example: BINSEC checks ValidPublicKey(public uint32) bool.
# Start inside the function; Go's runtime start-up is not analyzed.
starting from <main.ValidPublicKey>
with concrete stack pointer

# Go passes integer arguments in registers: 1st rax, 2nd rbx, 3rd rcx, 4th rdi, 5th rsi, 6th r8.
rax := nondet as public          # nondet = any value, known to the attacker

# Go functions start by comparing the stack pointer with a limit stored at r14 + 16.
# Store 0 there so the stack never needs to grow.
r14 := 0x300000
@[r14 + 16, 8] := 0

# Stop when the function returns: its true/false answer may be public.
halt at <main.ValidPublicKey> return
explore all
