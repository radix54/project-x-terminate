# Control flow or memory addresses. The analyzed function's input layout is:
#   rax = sk
#   Stack[0x8:0x20] = Mprime (24 bytes)
#   Stack[0x20:0x38] = rnd (24 bytes)
starting from <ml-dsa/internal.(*SigningKey).SignInternal>
with concrete stack pointer

rax := 0x400000 as sk
rbx := 0x640000 as Mprime_data
rcx := 24 as Mprime_len
rdi := 24 as Mprime_cap
rsi := 0x640100 as rnd_data
r8 := 24 as rnd_len
r9 := 24 as rnd_cap
@[0x640000, 192] := nondet as Mprime
@[0x640100, 192] := secret as rnd

# SigningKey is addressed publicly. Its cfg and vector slice headers are public;
# key bytes stored in the struct and vector backing arrays are secret.
@[0x400000, 64] := 0x500000 as cfg
@[0x400020, 256] := secret as rho
@[0x400040, 256] := secret as K
@[0x400060, 512] := secret as tr

# s1, s2, and t0 slice headers (len=cap=4) point to fixed backing arrays.
@[0x4000a0, 64] := 0x600000 as s1_data
@[0x4000a8, 64] := 4 as s1_len
@[0x4000b0, 64] := 4 as s1_cap
@[0x4000b8, 64] := 0x610000 as s2_data
@[0x4000c0, 64] := 4 as s2_len
@[0x4000c8, 64] := 4 as s2_cap
@[0x4000d0, 64] := 0x620000 as t0_data
@[0x4000d8, 64] := 4 as t0_len
@[0x4000e0, 64] := 4 as t0_cap

# ML-DSA-44 configuration fields read by SignInternal.
@[0x500018, 32] := 95232
@[0x500012, 16] := 128
@[0x500014, 8] := 17
@[0x50001c, 8] := 4
@[0x50001d, 8] := 4
@[0x50001f, 8] := 78
@[0x500020, 8] := 80

# Slice backing arrays are secret input material; callees using them are
# summarized below, so only their fixed public addresses are modeled here.
@[0x600000, 131072] := secret as s1
@[0x610000, 131072] := secret as s2
@[0x620000, 131072] := secret as t0

# Go's stack-growth check reads g.stackguard0 from r14+16.
r14 := 0x300000
@[r14 + 16, 8] := 0

# Skip Go runtime machinery so checkct focuses on SignInternal's own code.
# These hooks are abstractions: allocations return without modeling heap state,
# and memmove does not copy bytes. Results therefore cover the paths BINSEC can
# explore under these summaries, not the full Go runtime semantics.
replace <runtime.makeslice> by
  rax := 0x701000
  return
end

replace <runtime.growslice> by
  rax := 0x701000
  return
end

replace <runtime.memmove> by
  return
end

# Stack growth is disabled above. A bounds panic is not a normal signing path.
replace <runtime.morestack_noctxt.abi0> by
  return
end

replace <runtime.panicBounds> by
  assume false
  return
end

# Ignore every non-runtime function called by SignInternal. These stubs keep
# checkct focused on branches and memory accesses in SignInternal itself.
replace <ml-dsa/internal/ring.LowBitsVec> by
  rax := 0x700000
  rbx := 4
  rcx := 4
  return
end

replace <ml-dsa/internal/ring.Rq.HighBits> by
  return
end

replace <ml-dsa/internal/util.ExpandA> by
  rax := 0x700300
  rbx := 4
  rcx := 4
  return
end

replace <ml-dsa/internal/util.ExpandMask> by
  rax := 0x700400
  rbx := 4
  rcx := 4
  return
end

replace <ml-dsa/internal/util.H> by
  return
end

replace <ml-dsa/internal/util.InvNttVec> by
  return
end

replace <ml-dsa/internal/util.MakeHint> by
  rax := 0x700800
  rbx := 4
  rcx := 4
  return
end

replace <ml-dsa/internal/util.MatrixVectorNTT> by
