# Check that signing does not leak the secret key or the secret inputs through
# control flow or memory addresses. The analyzed function's input layout is:
#   rax = sk
#   Stack[0x8:0x20] = Mprime (24 bytes)
#   Stack[0x20:0x38] = rnd (24 bytes)
starting from <ml-dsa/internal.(*SigningKey).SignInternal>
with concrete stack pointer

rax := secret as skt
@[rsp + 0x8, 192] := nondet as Mprime
@[rsp + 0x20, 192] := secret as rnd

# Go's stack-growth check reads g.stackguard0 from r14+16.
r14 := 0x300000
@[r14 + 16, 8] := 0

# Skip Go runtime machinery so checkct focuses on SignInternal's own code.
# These hooks are abstractions: allocations return without modeling heap state,
# and memmove does not copy bytes. Results therefore cover the paths BINSEC can
# explore under these summaries, not the full Go runtime semantics.
replace <runtime.makeslice> by
  return
end

replace <runtime.growslice> by
  return
end

replace <runtime.memmove> by
  return
end

# Stack growth is disabled above. A bounds panic is not a normal signing path.
replace <runtime.morestack_noctxt.abi0> by
  return
end

replace <runtime.panicBounds> by
  assume false
  return
end

halt at <ml-dsa/internal.(*SigningKey).SignInternal> return
explore all
