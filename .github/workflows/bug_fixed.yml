name: Analyzed Functions

on:
    push:

env:
    MARK: א
    BUG: BUG
    FIXED: FIX
        
        
jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Count how many bugs in the code
              run: |
                bugs=$(grep -o '$(BUG)' $(git ls-files '*.go') | wc -l)

            - name: Count how many fixed bugs in the code
              run: |
                fixed=$(grep -o '$(FIXED)' $(git ls-files '*.go') | wc -l)

            - name: Percetage of bugs in the code
              run: |
                percentage=$(echo "scale=2; ($fixed / $bugs) * 100" | bc)
