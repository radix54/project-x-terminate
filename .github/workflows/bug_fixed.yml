name: Fixed Bugs

on:
    push:
        branches: [ "master" ]

concurrency:
    group: fixed-bugs-badge-${{ github.ref }}
    cancel-in-progress: false

env:
    BUG: "BUG"
    FIXED: "FIX"

jobs:
    count:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Create badge
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                for attempt in 1 2 3 4 5; do
                  git fetch origin master
                  git reset --hard origin/master

                  bugs=$(git grep -o -F "$BUG" -- '*.go' | wc -l | tr -d '[:space:]')
                  fixed=$(git grep -o -F "$FIXED" -- '*.go' | wc -l | tr -d '[:space:]')
                  percentage=$(awk -v fixed="$fixed" -v bugs="$bugs" 'BEGIN { if (bugs == 0) print "0.00"; else printf "%.2f", fixed * 100 / bugs }')

                  mkdir -p .github/badges
                  printf '{"schemaVersion":1,"label":"Fixed Bugs","message":"%s%%","color":"blue"}\n' "$percentage" > .github/badges/fixed_bugs.json
                  git add .github/badges/fixed_bugs.json

                  if git diff --cached --quiet; then
                    exit 0
                  fi

                  git commit -m "Update fixed bugs badge"
                  if git push origin HEAD:master; then
                    exit 0
                  fi

                  sleep 2
                done

                echo "Could not publish fixed bugs badge after 5 attempts" >&2
                exit 1
