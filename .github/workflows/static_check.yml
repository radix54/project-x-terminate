name: Static Checks
on: ["push", "pull_request"]

jobs:
    static_check:
        strategy:
            fail-fast: false
            matrix:
                os: ["windows-latest", "ubuntu-latest", "macOS-latest"]
                go: ["1.24", "1.27"]
        runs-on: ${{ matrix.os }}
        steps:
        - uses: actions/checkout@v7
          with:
              fetch-depth: 1
        - uses: WillAbides/setup-go-faster@v1.19.0
          with:
              go-version: ${{ matrix.go }}
        - run: "go vet ./..."
        - uses: dominikh/staticcheck-action@v1.4.1
          with:
              install-go: false
              cache-key: ${{ matrix.go }}