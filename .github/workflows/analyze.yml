name: Analyzed Functions

on:
    push:

env:
    MARK: "א"

jobs:
    count:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Count marks
              run: |
                count=$(git grep -o -F "$MARK" -- '*.go' | wc -l | tr -d '[:space:]')

            - name: Create badge
              run: |
                mkdir -p .github/badges
                printf '{"schemaVersion":1,"label":"Marks","message":"%s","color":"blue"}\n' "$count" > .github/badges/analyze.json

                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add .github/badges/analyze.json
                if ! git diff --cached --quiet; then
                  git commit -m "Update analyzed marks badge"
                  git push
                fi
