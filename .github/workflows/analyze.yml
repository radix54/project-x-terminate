name: Analyzed Functions

on:
    push:
        branches: [ "master" ]

concurrency:
    group: analyze-badge-${{ github.ref }}
    cancel-in-progress: false

env:
    MARK: "א"

jobs:
    count:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Create badge
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                for attempt in 1 2 3 4 5; do
                  # Start from the latest master so another push cannot make
                  # this badge commit stale.
                  git fetch origin master
                  git reset --hard origin/master

                  count=$(git grep -o -F "$MARK" -- '*.go' | wc -l | tr -d '[:space:]')
                  mkdir -p .github/badges
                  printf '{"schemaVersion":1,"label":"Marks","message":"%s","color":"blue"}\n' "$count" > .github/badges/analyze.json
                  git add .github/badges/analyze.json

                  if git diff --cached --quiet; then
                    exit 0
                  fi

                  git commit -m "Update analyzed marks badge"
                  if git push origin HEAD:master; then
                    exit 0
                  fi

                  sleep 2
                done

                echo "Could not publish badge after 5 attempts" >&2
                exit 1
